[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    integration: 模块间协作测试
    ui: Streamlit 界面渲染测试
    e2e: Playwright 浏览器端到端测试
    playwright: Playwright 浏览器 E2E 测试（需安装 playwright）
    online: 需要外部网络的测试（CrossRef等）
    benchmark: LLM-as-judge 漂移基准测试

addopts = --strict-markers -q
